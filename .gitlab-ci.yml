# Thin on purpose: every gate lives in the Makefile so GitHub runs the same thing.
stages: [gates, release]

.gates:
  stage: gates
  before_script:
    - make install
  script:
    - make ci

gates-3.11:
  extends: .gates
  image: python:3.11-slim

gates-3.13:
  extends: .gates
  image: python:3.13-slim

release:
  stage: release
  image: python:3.13-slim
  services: [docker:dind]
  variables:
    DOCKER_HOST: tcp://docker:2375
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends make git docker.io >/dev/null
    - make install
  script:
    - make ci
    - make release
    - test -z "$CI_REGISTRY_IMAGE" || (docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY" && make push REGISTRY="$CI_REGISTRY_IMAGE")
  artifacts:
    paths: [dist/]
