# Thin on purpose: every gate lives in the Makefile so GitLab runs the same thing.
name: ci
on: [push, pull_request]
jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: make install
      - run: make ci
