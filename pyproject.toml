[project]
name = "arb-mcp"
version = "0.1.0"
description = "Architecture Review Board MCP: deterministic C4/DSL validation, conversion and query — the engine of a Kiro Power."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "lark>=1.1",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.0", "types-jsonschema>=4.21"]

[project.scripts]
arb-mcp = "arb_mcp.infra.mcp.stdio_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arb_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/arb_mcp/domain/_engine"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.ruff.lint.per-file-ignores]
# tests read fixtures inline and use throwaway multi-statement setup
"tests/**" = ["SIM115", "E702"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/arb_mcp"]
exclude = ["src/arb_mcp/domain/_engine/"]

[[tool.mypy.overrides]]
module = "arb_mcp.domain._engine.*"
ignore_errors = true
follow_imports = "skip"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
