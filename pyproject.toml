[project]
name = "arb-mcp"
version = "0.1.0"
description = "Architecture Review Board MCP: deterministic C4/DSL validation, conversion and catalog reconciliation — the engine of a Kiro Power."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
# The HTTP adapter is opt-in so the core (domain + application + stdio) stays free of
# any web framework. `pip install arb-mcp[http]` for CI or the demo.
# pydantic and starlette are imported directly by the adapter, so they are declared
# directly: relying on fastapi to drag them in is a transitive dependency that a
# fastapi upgrade could silently break (deptry DEP003).
http = ["fastapi>=0.115", "starlette>=0.40", "pydantic>=2.0", "uvicorn>=0.30", "PyJWT[crypto]>=2.9"]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.0", "types-jsonschema>=4.21", "httpx>=0.27", "pre-commit>=3.8", "pytest-cov>=5.0", "import-linter>=2.0", "deptry>=0.20", "pip-audit>=2.7", "hypothesis>=6.100", "pytest-bdd>=8.0", "build>=1.2", "cyclonedx-bom>=4.0", "commitizen>=4.0"]

[project.scripts]
arb-mcp = "arb_mcp.infra.mcp.stdio_server:main"
arb-mcp-http = "arb_mcp.infra.http:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arb_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
# Correctness, imports, modernisation, bugbear, simplification — plus what a bank
# reviewer asks for: S (bandit security), ARG/ERA/T20 (dead or debugging code),
# PTH/PERF/FURB/RUF (idioms), N (naming), LOG/G (logging), PL (pylint subset).
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF", "C4", "PTH", "PT", "ARG",
          "T20", "ERA", "N", "PERF", "FURB", "LOG", "G", "PL"]
# Argument-count limits are a style preference, not a defect; the drawio cell
# builders legitimately take x, y, w, h, style, label, parent.
ignore = ["PLR0913", "PLR0917"]
[tool.ruff.lint.per-file-ignores]
# Tests assert (S101), compare literals (PLR2004), compound-assert (PT018), parse
# the XML they themselves produced (S314), hold a fake token (S105), and import
# inline to keep each test self-contained (PLC0415, PTH123).
"tests/**" = ["SIM115", "E702", "S101", "S105", "S314", "PT018", "PLR2004", "PLC0415", "PTH123"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/arb_mcp", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Coverage on every run, branch-aware, and the missing lines named: a number
# without the lines behind it is not actionable. The threshold is a RATCHET set to
# the measured floor, not a round number picked in advance; it only moves up.
addopts = "--cov=arb_mcp --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=94"

[tool.coverage.run]
source = ["arb_mcp"]
branch = true
# The vendored engine is measured but not gated on: it is ported code, bit-for-bit
# equivalent to Structurizr on the measured corpus and exempt from ruff/mypy for the
# same reason (CLAUDE.md). Gating on it would either freeze it or invite rewrites.

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",                      # Protocol bodies
]

[tool.deptry]
# Dev tools are not imported by the package; they are commands. Tell deptry so it
# does not report them as unused, and keep DEP003 (a transitive import) as an error:
# that is exactly the silent missing dependency this gate exists to catch.
optional_dependencies_dev_groups = ["dev"]

[tool.commitizen]
# Version and changelog come from the conventional commits already enforced at
# commit-msg. `make bump` decides patch/minor/major from the commit types since
# the last tag, rewrites the version in pyproject, prepends the CHANGELOG
# section and creates the v* tag that the release pipeline listens to.
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_incremental = true
annotated_tag = true
bump_message = "chore(release): $current_version -> $new_version"
