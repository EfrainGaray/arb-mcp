[project]
name = "arb-mcp"
version = "0.1.0"
description = "Architecture Review Board MCP: deterministic C4/DSL validation, conversion and catalog reconciliation — the engine of a Kiro Power."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "lark>=1.1",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
# The HTTP adapter is opt-in so the core (domain + application + stdio) stays free of
# any web framework. `pip install arb-mcp[http]` for CI or the demo.
http = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.0", "types-jsonschema>=4.21", "httpx>=0.27", "pre-commit>=3.8", "pytest-cov>=5.0"]

[project.scripts]
arb-mcp = "arb_mcp.infra.mcp.stdio_server:main"
arb-mcp-http = "arb_mcp.infra.http:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arb_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/arb_mcp/domain/_engine"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.ruff.lint.per-file-ignores]
# tests read fixtures inline and use throwaway multi-statement setup
"tests/**" = ["SIM115", "E702"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/arb_mcp"]
exclude = ["src/arb_mcp/domain/_engine/"]

[[tool.mypy.overrides]]
module = "arb_mcp.domain._engine.*"
ignore_errors = true
follow_imports = "skip"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Coverage on every run, branch-aware, and the missing lines named: a number
# without the lines behind it is not actionable. The threshold is a RATCHET set to
# the measured floor, not a round number picked in advance; it only moves up.
addopts = "--cov=arb_mcp --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=92"

[tool.coverage.run]
source = ["arb_mcp"]
branch = true
# The vendored engine is measured but not gated on: it is ported code, bit-for-bit
# equivalent to Structurizr on the measured corpus and exempt from ruff/mypy for the
# same reason (CLAUDE.md). Gating on it would either freeze it or invite rewrites.
omit = ["*/domain/_engine/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",                      # Protocol bodies
]
